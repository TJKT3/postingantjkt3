<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Galeri Nostalgia • Kenangan & Irama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ebdfcc 0%, #cfb693 100%);
            font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, -apple-system, 'Georgia', serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(253, 246, 235, 0.88);
            backdrop-filter: blur(3px);
            border-radius: 4rem 2rem 4rem 2rem;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2), inset 0 1px 4px rgba(255, 252, 220, 0.8);
            padding: 2rem 1.8rem 3rem;
            border: 1px solid #f7e5d0;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #4d2e1b, #8b6843);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 6px 6px 12px rgba(90, 60, 30, 0.2);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .hero p {
            font-size: 1.2rem;
            color: #5a3c22;
            background: #fff2e2cc;
            display: inline-block;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            margin-top: 12px;
            font-style: italic;
            box-shadow: inset 0 0 2px #ffefd0, 0 4px 6px #0000001a;
        }

        .film-strip {
            display: flex;
            justify-content: center;
            gap: 0.2rem;
            margin-top: 1rem;
            opacity: 0.5;
        }

        .film-strip span {
            width: 22px;
            height: 8px;
            background: #3f2a1a;
            border-radius: 20px;
        }

        .gallery-photo {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 1rem;
        }

        .polaroid {
            background: #fffcf5;
            width: 280px;
            border-radius: 16px 16px 28px 28px;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(255, 250, 210, 0.6) inset;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            transform: rotate(0deg);
        }

        .polaroid:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 28px 36px -12px rgba(0, 0, 0, 0.45);
        }

        .photo-frame {
            background: #e1cfb0;
            padding: 12px 12px 6px 12px;
            border-radius: 12px 12px 8px 8px;
        }

        .photo-frame img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: filter 0.2s;
            background: #b6896b;
        }

        .caption {
            padding: 0.8rem 0.8rem 1.2rem;
            text-align: center;
            font-family: 'Caveat', 'Segoe UI', cursive;
            font-size: 1rem;
            font-weight: 500;
            color: #4f2f18;
            background: #fffcf0;
            border-radius: 0 0 22px 22px;
            letter-spacing: 0.3px;
            border-top: 1px dashed #e7cfb0;
        }

        .caption .nostalgia-tag {
            font-size: 0.7rem;
            background: #efdecb;
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 5px;
            color: #744d2e;
            font-family: monospace;
        }

        .footer-note {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 2px dotted #c9ae84;
            font-size: 0.85rem;
            color: #5f3f28;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .btn-nostalgia {
            background: #ab8c64;
            border: none;
            padding: 8px 22px;
            border-radius: 60px;
            color: #fff7e8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: inherit;
        }

        .btn-nostalgia:hover {
            background: #7e5d3c;
            transform: scale(0.97);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.86);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 85vw;
            max-height: 85vh;
            background: #fef5e8;
            padding: 12px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: fadeZoom 0.25s ease;
        }

        .lightbox-content img {
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 20px;
        }

        .lightbox-caption {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1.2rem;
            padding: 12px;
            background: #fef5e8;
            border-radius: 0 0 24px 24px;
            color: #4e2d18;
            font-weight: 500;
        }

        @keyframes fadeZoom {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .music-player-tap {
            text-align: center;
            margin: 8px auto 10px;
        }
        
        .music-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(252, 240, 220, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-family: 'Caveat', monospace;
            color: #5a3a20;
            border: 1px solid #e2caa8;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        
        .music-indicator:hover {
            background: #f7e8d4;
            transform: scale(1.02);
        }
        
        .music-indicator:active {
            transform: scale(0.98);
        }
        
        .music-active {
            background: #e6d5bd;
            box-shadow: 0 0 8px rgba(150, 100, 50, 0.3);
        }

        .soft-warning {
            font-size: 10px;
            color: #a5724b;
            background: #fff1e0;
            border-radius: 20px;
            padding: 2px 8px;
            display: inline-block;
            margin-top: 4px;
        }

        @media (max-width: 760px) {
            .container {
                padding: 1.5rem 1rem;
            }
            .hero h1 {
                font-size: 2.3rem;
            }
            .polaroid {
                width: 260px;
            }
        }

        @media (max-width: 580px) {
            .polaroid {
                width: 90%;
                max-width: 290px;
            }
        }

        .container {
            background-image: radial-gradient(circle at 25% 40%, rgba(170,130,80,0.08) 2%, transparent 2.5%);
            background-size: 28px 28px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>kenangan TJKT III</h1>
        <p>foto, dan cerita dalam bingkai</p>
        <div class="film-strip">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- Musik: 1x putar, tap untuk memutar ulang -->
    <div class="music-player-tap">
        <div class="music-indicator" id="musicTapButton">
            <span class="music-icon">🎵</span>
            <span class="music-text" id="musicStatusText">tap untuk memutar musik</span>
            <span class="music-icon">♪</span>
        </div>
    </div>

    <!-- GALERI FOTO (14 foto, tanpa teks HEIC/JPG) -->
    <div class="gallery-photo" id="galleryNostalgia"></div>

    <div class="footer-note">
        <div>🎞️ polaroid vintage • hati yang tersimpan</div>
        <button class="btn-nostalgia" id="refreshMoodBtn">📀 putar kembali kenangan</button>
        <div>🕰️ setiap foto punya cerita</div>
    </div>
</div>

<!-- Lightbox untuk foto -->
<div id="lightboxModal" class="lightbox">
    <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="memori terbuka">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
</div>

<script>
    // ======================= MUSIK (1x putar, tap untuk ulang) ======================
    const audio = new Audio('music.mp3');
    audio.loop = false;
    audio.volume = 0.55;
    audio.preload = 'auto';
    
    let isPlaying = false;
    let hasEnded = false;
    
    const musicTapBtn = document.getElementById('musicTapButton');
    const statusTextSpan = document.getElementById('musicStatusText');
    
    function updateMusicUI() {
        if (!statusTextSpan) return;
        if (isPlaying) {
            statusTextSpan.innerHTML = '♪ musik sedang mengalun';
            musicTapBtn.classList.add('music-active');
        } else if (hasEnded) {
            statusTextSpan.innerHTML = '🎵 lagu selesai • tap untuk putar ulang 🎵';
            musicTapBtn.classList.remove('music-active');
        } else {
            statusTextSpan.innerHTML = 'tap untuk memutar suara! 🎵';
            musicTapBtn.classList.remove('music-active');
        }
    }
    
    function playMusic() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
        }
        audio.currentTime = 0;
        audio.play()
            .then(() => {
                isPlaying = true;
                hasEnded = false;
                updateMusicUI();
            })
            .catch((err) => {
                console.warn("Musik gagal diputar:", err);
                isPlaying = false;
                updateMusicUI();
                statusTextSpan.innerHTML = '🎵 sentuh lagi untuk mulai 🎵';
                setTimeout(() => { if (!isPlaying && !hasEnded) updateMusicUI(); }, 1200);
            });
    }
    
    audio.addEventListener('ended', () => {
        isPlaying = false;
        hasEnded = true;
        updateMusicUI();
    });
    
    audio.addEventListener('error', () => {
        if (statusTextSpan) statusTextSpan.innerHTML = '⚠️ file musik tidak tersedia ⚠️';
        isPlaying = false;
        hasEnded = false;
    });
    
    musicTapBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playMusic();
    });
    
    updateMusicUI();
    
    // ======================= GALERI FOTO (14 FOTO, TANPA TEKS HEIC/JPG) ========================
    // Daftar semua foto: caption hanya kata-kata nostalgia, tanpa embel-embel format file
    const daftarFoto = [
        // 4 HEIC
        { namaFile: "lanurpratamaa-20260501-0002.heic", caption: "🌤️ senja yang tak pernah usai", alt: "kenangan 0002" },
        { namaFile: "lanurpratamaa-20260501-0003.heic", caption: "🎞️ tawa & rintik hujan", alt: "kenangan 0003" },
        { namaFile: "lanurpratamaa-20260501-0004.heic", caption: "⭐ bintang yang tersenyum", alt: "kenangan 0004" },
        { namaFile: "lanurpratamaa-20260501-0005.heic", caption: "✨ cahaya dari masa lalu", alt: "kenangan 0005" },
        // 3 JPG sebelumnya
        { namaFile: "arfaprmd-20260501-0001.jpg", caption: "🌅 pelangi kenangan", alt: "foto jpg pertama" },
        { namaFile: "arfaprmd-20260501-0002.jpg", caption: "🏞️ senja kedua yang abadi", alt: "foto jpg kedua" },
        { namaFile: "meimei_me1-20260501-0001.jpg", caption: "🌸 senyum yang tersimpan", alt: "foto meimei" },
        // 7 foto baru (foto1.jpg s/d foto7.jpg)
        { namaFile: "foto1.jpg", caption: "📸 lembar kenangan pertama", alt: "foto 1" },
        { namaFile: "foto2.jpg", caption: "🍂 cerita di balik senyum", alt: "foto 2" },
        { namaFile: "foto3.jpg", caption: "🌻 hangatnya waktu", alt: "foto 3" },
        { namaFile: "foto4.jpg", caption: "⭐ senyuman didalam ruang", alt: "foto 4" },
        { namaFile: "foto5.jpg", caption: "🍃 desir kenangan", alt: "foto 5" },
        { namaFile: "foto6.jpg", caption: "🎈 tawa yang abadi", alt: "foto 6" },
        { namaFile: "foto7.jpg", caption: "💫 kita dan ruang waktu", alt: "foto 7" }
    ];

    const galleryContainer = document.getElementById('galleryNostalgia');
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    // Fungsi untuk menghasilkan rotasi random yang konsisten per indeks
    function getRandomRotation(idx) {
        const rotations = [-1.8, -1.2, -0.7, 0.5, 1.0, 1.6, 2.0, -1.5, -0.3, 0.8, 1.3, 1.9, -0.9, 0.3];
        return rotations[idx % rotations.length];
    }

    function renderGallery() {
        galleryContainer.innerHTML = '';
        
        daftarFoto.forEach((foto, idx) => {
            const technicalPath = `img/${foto.namaFile}`;
            const polaroidCard = document.createElement('div');
            polaroidCard.className = 'polaroid';
            polaroidCard.setAttribute('data-idx', idx);
            // berikan rotasi individual
            const rotateVal = getRandomRotation(idx);
            polaroidCard.style.transform = `rotate(${rotateVal}deg)`;
            
            polaroidCard.innerHTML = `
                <div class="photo-frame">
                    <img src="${technicalPath}" alt="${foto.alt}" loading="lazy" 
                         onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20600%20400%22%3E%3Crect%20width%3D%22600%22%20height%3D%22400%22%20fill%3D%22%23d6b17e%22%2F%3E%3Ctext%20x%3D%22300%22%20y%3D%22180%22%20font-size%3D%2217%22%20text-anchor%3D%22middle%22%20fill%3D%22%234d2e1b%22%3E🎞️%20bingkai%20rindu%3C%2Ftext%3E%3Ctext%20x%3D%22300%22%20y%3D%22220%22%20font-size%3D%2213%22%20text-anchor%3D%22middle%22%20fill%3D%22%237a551e%22%3Ekenangan%20tersimpan%3C%2Ftext%3E%3C%2Fsvg%3E';
                         this.style.objectFit='contain';
                         if(!this.parentElement.parentElement.querySelector('.soft-warning')) {
                            const gentleNote = document.createElement('div');
                            gentleNote.className = 'soft-warning';
                            gentleNote.innerText = '📸 potret sedang berlabuh';
                            this.parentElement.after(gentleNote);
                         }">
                </div>
                <div class="caption">
                    🕰️ ${foto.caption}
                    <span class="nostalgia-tag">✦ kenangan abadi ✦</span>
                </div>
            `;
            
            polaroidCard.addEventListener('click', () => {
                const imgElement = polaroidCard.querySelector('.photo-frame img');
                let srcImage = imgElement.src;
                let additionalInfo = (srcImage.includes('data:image/svg')) ? ' (file belum tersedia)' : '';
                lightboxImg.src = srcImage;
                lightboxCaption.innerHTML = `📷 ${foto.caption} ${additionalInfo}`;
                lightbox.classList.add('active');
            });
            
            galleryContainer.appendChild(polaroidCard);
        });
    }

    // Tutup lightbox
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target === lightboxModal) {
            lightbox.classList.remove('active');
        }
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
        }
    });

    // Tombol nostalgia efek lembut
    const nostalgicBtn = document.getElementById('refreshMoodBtn');
    nostalgicBtn.addEventListener('click', () => {
        const allCards = document.querySelectorAll('.polaroid');
        allCards.forEach(card => {
            card.style.transition = 'all 0.12s';
            card.style.transform = `scale(0.98) rotate(${Math.random() * 2 - 1}deg)`;
            setTimeout(() => {
                const idx = parseInt(card.getAttribute('data-idx')) || 0;
                card.style.transform = `rotate(${getRandomRotation(idx)}deg)`;
            }, 180);
        });
        const toastMsg = document.createElement('div');
        toastMsg.innerText = '🎞️ bernostalgia...';
        toastMsg.style.position = 'fixed';
        toastMsg.style.bottom = '22px';
        toastMsg.style.left = '50%';
        toastMsg.style.transform = 'translateX(-50%)';
        toastMsg.style.backgroundColor = '#2e241be6';
        toastMsg.style.color = '#f7e5cd';
        toastMsg.style.padding = '8px 20px';
        toastMsg.style.borderRadius = '40px';
        toastMsg.style.fontFamily = 'monospace';
        toastMsg.style.fontSize = '0.8rem';
        toastMsg.style.zIndex = '999';
        toastMsg.style.pointerEvents = 'none';
        document.body.appendChild(toastMsg);
        setTimeout(() => {
            toastMsg.style.opacity = '0';
            setTimeout(() => toastMsg.remove(), 500);
        }, 1400);
    });

    // Inisialisasi galeri
    document.addEventListener('DOMContentLoaded', () => {
        renderGallery();
        console.log('✅ Galeri siap: 14 foto kenangan di folder img');
    });
</script>

<!-- 
    ✨ PETUNJUK LENGKAP UNTUK PEMILIK WEBSITE ✨
    
    📁 STRUKTUR FOLDER YANG BENAR:
    
        root folder (tempat file HTML)
        │
        ├── index.html
        ├── music.mp3                (file musik, SEJAJAR dengan HTML)
        │
        └── img/                     (folder untuk semua gambar)
            ├── lanurpratamaa-20260501-0002.heic
            ├── lanurpratamaa-20260501-0003.heic
            ├── lanurpratamaa-20260501-0004.heic
            ├── lanurpratamaa-20260501-0005.heic
            ├── arfaprmd-20260501-0001.jpg
            ├── arfaprmd-20260501-0002.jpg
            ├── meimei_me1-20260501-0001.jpg
            ├── foto1.jpg
            ├── foto2.jpg
            ├── foto3.jpg
            ├── foto4.jpg
            ├── foto5.jpg
            ├── foto6.jpg
            └── foto7.jpg
    
    🎵 MUSIK:
        - Hanya diputar 1 KALI (tidak looping)
        - Untuk memutar ulang, TAP indikator musik (badge)
    
    📸 FOTO (total 14 foto):
        - Semua disimpan di folder "img"
        - Caption pada setiap foto hanya berisi kata-kata nostalgia (tanpa embel-embel HEIC/JPG)
        - Klik pada foto akan membuka lightbox untuk melihat lebih besar
    
    💡 SEMUA PATH TEKNIS TERSEMBUNYI dari tampilan pengguna.
    - Tidak ada teks yang memperlihatkan folder "img" atau ekstensi file
    - Tampilan hanya menampilkan kenangan dan nostalgia yang indah
    - Setiap kartu foto memiliki efek polaroid vintage dengan rotasi unik
-->
</body>
</html>
