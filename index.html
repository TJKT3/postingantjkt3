<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenangan SMK - Galeri Teman Seangkatan</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #f3e5f5 0%, #e1d5e7 100%);
            color: #1e1e2a;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 60px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .header h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Instagram Live Feed Section */
        .live-feed {
            background: #fff0f5;
            border-radius: 48px;
            padding: 20px;
            margin-bottom: 50px;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #ffffffcc;
            border-radius: 100px;
            width: fit-content;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }

        .live-badge {
            background: #ff004f;
            color: white;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge i {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.6; transform: scale(1.1);}
            100% { opacity: 1; transform: scale(1);}
        }

        .instagram-embed-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            margin-top: 20px;
        }

        .insta-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            width: 320px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .insta-card:hover {
            transform: translateY(-7px);
        }

        .insta-iframe {
            width: 100%;
            min-height: 380px;
            border: none;
        }

        /* Profile Cards Grid */
        .section-title {
            font-size: 2rem;
            margin: 30px 0 20px;
            text-align: center;
            font-weight: 600;
            border-left: 8px solid #e1306c;
            padding-left: 20px;
            display: inline-block;
            width: auto;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            width: 280px;
            padding: 20px 15px 25px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .profile-card:hover {
            transform: scale(1.02);
            background: white;
            box-shadow: 0 25px 30px -12px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #e1306c;
            padding: 3px;
            background: white;
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .profile-name {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px 0 5px;
        }

        .profile-note {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 8px;
            border: none;
        }

        .instagram-link i {
            font-size: 1.3rem;
        }

        .instagram-link:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: #4a3b5c;
            font-size: 0.8rem;
            padding: 20px;
        }

        @media (max-width: 680px) {
            .header h1 { font-size: 2rem; }
            .insta-card { width: 95%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-graduation-cap"></i> Kenangan SMK <i class="fas fa-heart" style="color:#e1306c;"></i></h1>
    <p>Bersama kita ukir cerita • Teman seangkatan seperjuangan</p>
</div>

<!-- === Instagram LIVE FEED === -->
<div class="live-feed">
    <div class="live-header">
        <span class="live-badge"><i class="fas fa-circle"></i> LIVE NOW</span>
        <span><i class="fab fa-instagram"></i> Feed dari Instagram Teman-teman</span>
    </div>
    <div class="instagram-embed-grid" id="instagramLiveFeed">
        <div style="text-align:center; width:100%; padding:20px;">Memuat postingan Instagram terbaru... <i class="fas fa-spinner fa-pulse"></i></div>
    </div>
    <p style="text-align:center; margin-top:12px; font-size:13px;"><i class="fab fa-instagram"></i> Menampilkan postingan dari akun yang dipilih — refresh otomatis tiap 2 menit</p>
</div>

<!-- Profile Cards dengan gambar & Instagram -->
<h2 style="text-align:center;"><span class="section-title"><i class="fas fa-users"></i> Tankos Squad</span></h2>
<div class="grid-container" id="profileGrid"></div>

<footer>
    <i class="fas fa-camera-retro"></i> Kenangan terindah SMK • tetap terhubung lewat Instagram
</footer>

<script>
    // ======================= DATA PROFIL TEMAN =======================
    // Ganti dengan data teman-teman SMK mu yang sebenarnya
    const profiles = [
        {
            name: "Mykell",
            note: "Kelas XII • 2026",
            imageUrl: "https://randomuser.me/api/portraits/men/15.jpg",  // Ganti dengan foto asli Mykell
            instagramUsername: "mykelll15",
            instagramPostUrl: "https://www.instagram.com/p/DXTkSjfkmor/"   // Link postingan dari mykelll15
        },
        {
            name: "Andi Wijaya",
            note: "TKJ • 2024",
            imageUrl: "https://randomuser.me/api/portraits/men/32.jpg",
            instagramUsername: "andiwijaya_",
            instagramPostUrl: "https://www.instagram.com/p/C-EXAMPLE1/"
        },
        {
            name: "Sinta Melati",
            note: "Multimedia • kreator",
            imageUrl: "https://randomuser.me/api/portraits/women/68.jpg",
            instagramUsername: "sintamelati",
            instagramPostUrl: "https://www.instagram.com/p/C-EXAMPLE2/"
        },
        {
            name: "Rizky Fadillah",
            note: "RPL • gamer & koder",
            imageUrl: "https://randomuser.me/api/portraits/men/45.jpg",
            instagramUsername: "rizkyfadil",
            instagramPostUrl: "https://www.instagram.com/p/C-EXAMPLE3/"
        },
        {
            name: "Lestari Purnama",
            note: "Akuntansi • the vibe",
            imageUrl: "https://randomuser.me/api/portraits/women/44.jpg",
            instagramUsername: "lestariprm",
            instagramPostUrl: "https://www.instagram.com/p/C-EXAMPLE4/"
        }
    ];

    // Render profile card dengan gambar + link instagram
    function renderProfiles() {
        const grid = document.getElementById('profileGrid');
        grid.innerHTML = '';
        profiles.forEach(profile => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            
            const img = document.createElement('img');
            img.src = profile.imageUrl;
            img.alt = profile.name;
            img.className = 'profile-img';
            
            const nameEl = document.createElement('div');
            nameEl.className = 'profile-name';
            nameEl.innerText = profile.name;
            
            const noteEl = document.createElement('div');
            noteEl.className = 'profile-note';
            noteEl.innerText = profile.note;
            
            const instaLink = document.createElement('a');
            instaLink.href = `https://instagram.com/${profile.instagramUsername}`;
            instaLink.target = '_blank';
            instaLink.className = 'instagram-link';
            instaLink.innerHTML = '<i class="fab fa-instagram"></i> @' + profile.instagramUsername;
            
            card.appendChild(img);
            card.appendChild(nameEl);
            card.appendChild(noteEl);
            card.appendChild(instaLink);
            grid.appendChild(card);
        });
    }

    // Load Instagram feeds dari setiap profil
    function loadInstagramFeeds() {
        const feedContainer = document.getElementById('instagramLiveFeed');
        feedContainer.innerHTML = '';
        
        profiles.forEach(profile => {
            if (!profile.instagramPostUrl) return;
            
            const cardDiv = document.createElement('div');
            cardDiv.className = 'insta-card';
            
            const captionWrap = document.createElement('div');
            captionWrap.style.padding = '8px 12px';
            captionWrap.style.background = '#f9f9f9';
            captionWrap.style.borderRadius = '20px';
            captionWrap.style.marginBottom = '6px';
            captionWrap.style.fontSize = '12px';
            captionWrap.innerHTML = `<i class="fab fa-instagram"></i> @${profile.instagramUsername} • postingan terbaru`;
            
            const blockquote = document.createElement('blockquote');
            blockquote.className = 'instagram-media';
            blockquote.setAttribute('data-instgrm-permalink', profile.instagramPostUrl);
            blockquote.setAttribute('data-instgrm-version', '14');
            blockquote.style.maxWidth = '100%';
            blockquote.style.minWidth = '250px';
            blockquote.style.margin = '0 auto';
            
            cardDiv.appendChild(captionWrap);
            cardDiv.appendChild(blockquote);
            feedContainer.appendChild(cardDiv);
        });
        
        // Load Instagram embed script
        if (!document.querySelector('#instaEmbedScript')) {
            const script = document.createElement('script');
            script.id = 'instaEmbedScript';
            script.src = 'https://www.instagram.com/embed.js';
            script.async = true;
            document.body.appendChild(script);
        } else if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
        }
        
        if (profiles.filter(p => p.instagramPostUrl).length === 0) {
            feedContainer.innerHTML = '<div style="padding:20px;text-align:center;">🔴 Belum ada link postingan Instagram. Tambahkan URL postingan di array profiles.</div>';
        }
    }
    
    // Tombol refresh manual
    const refreshBtn = document.createElement('button');
    refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Live Instagram Feed';
    refreshBtn.style.display = 'block';
    refreshBtn.style.margin = '12px auto';
    refreshBtn.style.padding = '8px 22px';
    refreshBtn.style.background = '#e1306c';
    refreshBtn.style.border = 'none';
    refreshBtn.style.borderRadius = '40px';
    refreshBtn.style.color = 'white';
    refreshBtn.style.fontWeight = 'bold';
    refreshBtn.style.cursor = 'pointer';
    refreshBtn.onclick = () => {
        loadInstagramFeeds();
        if (window.instgrm && window.instgrm.Embeds) setTimeout(() => window.instgrm.Embeds.process(), 500);
    };
    
    // Inisialisasi
    renderProfiles();
    loadInstagramFeeds();
    
    const liveSection = document.querySelector('.live-feed');
    if (liveSection && !document.querySelector('#manualRefreshBtn')) {
        refreshBtn.id = 'manualRefreshBtn';
        liveSection.appendChild(refreshBtn);
    }
    
    // Auto refresh setiap 2 menit
    setInterval(() => {
        loadInstagramFeeds();
        if (window.instgrm && window.instgrm.Embeds) setTimeout(() => window.instgrm.Embeds.process(), 400);
    }, 120000);
    
    console.log('%c✨ Website Kenangan SMK | Postingan @mykelll15 sudah terpasang! Untuk update, ganti link di array profiles.', 'color: #e1306c; font-size: 14px');
</script>

</body>
</html>
