<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Galeri Nostalgia • Lembaran Rindu & Irama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ebdfcc 0%, #cfb693 100%);
            font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, -apple-system, 'Georgia', serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* wadah bernuansa album tua */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(253, 246, 235, 0.88);
            backdrop-filter: blur(3px);
            border-radius: 4rem 2rem 4rem 2rem;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2), inset 0 1px 4px rgba(255, 252, 220, 0.8);
            padding: 2rem 1.8rem 3rem;
            border: 1px solid #f7e5d0;
        }

        /* header bernuansa kenangan */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #4d2e1b, #8b6843);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 6px 6px 12px rgba(90, 60, 30, 0.2);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .hero p {
            font-size: 1.2rem;
            color: #5a3c22;
            background: #fff2e2cc;
            display: inline-block;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            margin-top: 12px;
            font-style: italic;
            box-shadow: inset 0 0 2px #ffefd0, 0 4px 6px #0000001a;
        }

        /* strip dekoratif */
        .film-strip {
            display: flex;
            justify-content: center;
            gap: 0.2rem;
            margin-top: 1rem;
            opacity: 0.5;
        }

        .film-strip span {
            width: 22px;
            height: 8px;
            background: #3f2a1a;
            border-radius: 20px;
        }

        /* galeri dengan gaya polaroid */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 1rem;
        }

        .polaroid {
            background: #fffcf5;
            width: 290px;
            border-radius: 16px 16px 28px 28px;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(255, 250, 210, 0.6) inset;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            transform: rotate(0deg);
        }

        /* efek miring vintage */
        .polaroid:nth-child(1) { transform: rotate(-1.3deg); }
        .polaroid:nth-child(2) { transform: rotate(2deg); }
        .polaroid:nth-child(3) { transform: rotate(-1deg); }
        .polaroid:nth-child(4) { transform: rotate(1.5deg); }

        .polaroid:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 28px 36px -12px rgba(0, 0, 0, 0.45);
        }

        .photo-frame {
            background: #e1cfb0;
            padding: 12px 12px 6px 12px;
            border-radius: 12px 12px 8px 8px;
        }

        .photo-frame img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: filter 0.2s;
            background: #b6896b;
        }

        /* caption: hanya menampilkan kenangan */
        .caption {
            padding: 1rem 1rem 1.4rem;
            text-align: center;
            font-family: 'Caveat', 'Segoe UI', cursive;
            font-size: 1.1rem;
            font-weight: 500;
            color: #4f2f18;
            background: #fffcf0;
            border-radius: 0 0 22px 22px;
            letter-spacing: 0.3px;
            border-top: 1px dashed #e7cfb0;
        }

        .caption .nostalgia-tag {
            font-size: 0.75rem;
            background: #efdecb;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
            color: #744d2e;
            font-family: monospace;
        }

        /* footer */
        .footer-note {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 2px dotted #c9ae84;
            font-size: 0.85rem;
            color: #5f3f28;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .btn-nostalgia {
            background: #ab8c64;
            border: none;
            padding: 8px 22px;
            border-radius: 60px;
            color: #fff7e8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: inherit;
        }

        .btn-nostalgia:hover {
            background: #7e5d3c;
            transform: scale(0.97);
        }

        /* lightbox modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.86);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 85vw;
            max-height: 85vh;
            background: #fef5e8;
            padding: 12px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: fadeZoom 0.25s ease;
        }

        .lightbox-content img {
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 20px;
        }

        .lightbox-caption {
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 1.2rem;
            padding: 12px;
            background: #fef5e8;
            border-radius: 0 0 24px 24px;
            color: #4e2d18;
            font-weight: 500;
        }

        @keyframes fadeZoom {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 760px) {
            .container {
                padding: 1.5rem 1rem;
            }
            .hero h1 {
                font-size: 2.3rem;
            }
            .polaroid {
                width: 270px;
            }
            .gallery {
                gap: 1.8rem;
            }
        }

        @media (max-width: 580px) {
            .polaroid {
                width: 90%;
                max-width: 310px;
            }
        }

        .container {
            background-image: radial-gradient(circle at 25% 40%, rgba(170,130,80,0.08) 2%, transparent 2.5%);
            background-size: 28px 28px;
        }

        .soft-warning {
            font-size: 10px;
            color: #a5724b;
            background: #fff1e0;
            border-radius: 20px;
            padding: 2px 8px;
            display: inline-block;
            margin-top: 4px;
        }
        
        /* Musik diputar secara otomatis, tanpa tombol apapun — semua kontrol audio disembunyikan */
        .hidden-audio {
            display: none;
        }
        
        /* Indikator nostalgia kecil (opsional) bisa ditambahkan tap tidak mengganggu */
        .music-note {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.55;
            margin-top: 10px;
            letter-spacing: 2px;
            font-family: monospace;
            color: #7c623f;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>📼 kenangan & irama</h1>
        <p>musik mengalun lembut, membawa waktu pulang</p>
        <div class="film-strip">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="gallery" id="galleryNostalgia"></div>

    <div class="footer-note">
        <div>🎞️ polaroid vintage • hati yang tersimpan</div>
        <button class="btn-nostalgia" id="refreshMoodBtn">📀 putar kembali kenangan</button>
        <div>🕰️ setiap foto punya cerita</div>
    </div>
</div>

<!-- Lightbox kenangan -->
<div id="lightboxModal" class="lightbox">
    <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="memori terbuka">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
</div>

<script>
    // ======================= MUSIK OTOMATIS (tanpa tombol) ======================
    // File musik di folder "mp3" dengan nama "music.mp3"
    // Musik akan mulai otomatis saat halaman dimuat (berusaha semaksimal mungkin mengatasi kebijakan autoplay browser)
    // Tidak ada kontrol yang ditampilkan ke user.
    const audio = new Audio('mp3/music.mp3');
    audio.loop = true;      // mengulang untuk nuansa nostalgia panjang
    audio.volume = 0.55;    // volume lembut dan hangat
    
    // Fungsi untuk mencoba memutar musik secara otomatis
    function autoPlayMusic() {
        audio.play().then(() => {
            // berhasil autoplay
            console.log("Musik nostalgia menyala.");
        }).catch((err) => {
            // Gagal karena kebijakan browser (misalnya user belum berinteraksi)
            // Kita pasang listener satu kali agar musik mulai saat sentuhan/klik pertama kali di halaman
            // Tapi tetap TIDAK menampilkan tombol apapun, hanya interaksi halus.
            const startMusicOnInteraction = () => {
                audio.play().then(() => {
                    // musik berhasil diputar setelah interaksi
                }).catch(e => console.warn("masih gagal:", e));
                document.removeEventListener('click', startMusicOnInteraction);
                document.removeEventListener('touchstart', startMusicOnInteraction);
                document.removeEventListener('keydown', startMusicOnInteraction);
            };
            document.addEventListener('click', startMusicOnInteraction);
            document.addEventListener('touchstart', startMusicOnInteraction);
            document.addEventListener('keydown', startMusicOnInteraction);
        });
    }
    
    // Jalankan autoplay ketika halaman siap
    document.addEventListener('DOMContentLoaded', () => {
        autoPlayMusic();
    });
    
    // Opsional: jika ada error load file musik (miss), tidak mengganggu antarmuka.
    audio.addEventListener('error', () => {
        // Tidak menampilkan pesan error yang mengganggu, hanya diam-diam di console
        console.log("File musik tidak ditemukan di folder mp3/music.mp3, pastikan tersedia.");
    });
    
    // ======================= GALERI FOTO (HEIC) ========================
    // DATA FOTO: 4 gambar dengan format .heic. Tersimpan di folder img (tanpa menyebut di UI)
    // Nama file sesuai permintaan: lanurpratamaa-20260501-0002.heic s/d 0005.heic
    const fotoKenangan = [
        {
            namaTeknis: "lanurpratamaa-20260501-0002.heic",
            caption: "🌤️ senja yang tak pernah usai",
            alt: "bingkai nostalgia pertama"
        },
        {
            namaTeknis: "lanurpratamaa-20260501-0003.heic",
            caption: "🎞️ tawa & rintik hujan",
            alt: "bingkai kenangan kedua"
        },
        {
            namaTeknis: "lanurpratamaa-20260501-0004.heic",
            caption: "📼 memori di balik kabut",
            alt: "bingkai nostalgia ketiga"
        },
        {
            namaTeknis: "lanurpratamaa-20260501-0005.heic",
            caption: "✨ cahaya dari masa lalu",
            alt: "bingkai kenangan keempat"
        }
    ];

    const galleryContainer = document.getElementById('galleryNostalgia');
    const lightbox = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    function renderNostalgiaGallery() {
        galleryContainer.innerHTML = '';
        
        fotoKenangan.forEach((foto, idx) => {
            // path teknis: img/ + .heic (tidak akan tampil di UI)
            const technicalPath = `img/${foto.namaTeknis}`;
            
            const polaroidCard = document.createElement('div');
            polaroidCard.className = 'polaroid';
            polaroidCard.setAttribute('data-idx', idx);
            
            polaroidCard.innerHTML = `
                <div class="photo-frame">
                    <img src="${technicalPath}" alt="${foto.alt}" loading="lazy" 
                         onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20600%20400%22%3E%3Crect%20width%3D%22600%22%20height%3D%22400%22%20fill%3D%22%23d6b17e%22%2F%3E%3Ctext%20x%3D%22300%22%20y%3D%22180%22%20font-size%3D%2217%22%20text-anchor%3D%22middle%22%20fill%3D%22%234d2e1b%22%3E🎞️%20bingkai%20rindu%3C%2Ftext%3E%3Ctext%20x%3D%22300%22%20y%3D%22220%22%20font-size%3D%2213%22%20text-anchor%3D%22middle%22%20fill%3D%22%237a551e%22%3Ekenangan%20tersimpan%3C%2Ftext%3E%3C%2Fsvg%3E';
                         this.style.objectFit='contain';
                         if(!this.parentElement.parentElement.querySelector('.soft-warning')) {
                            const gentleNote = document.createElement('div');
                            gentleNote.className = 'soft-warning';
                            gentleNote.innerText = '📸 potret sedang berlabuh';
                            this.parentElement.after(gentleNote);
                         }">
                </div>
                <div class="caption">
                    🕰️ ${foto.caption}
                    <span class="nostalgia-tag">✦ kenangan abadi ✦</span>
                </div>
            `;
            
            polaroidCard.addEventListener('click', (e) => {
                const imageElement = polaroidCard.querySelector('.photo-frame img');
                let srcImage = imageElement.src;
                const captionIndah = foto.caption;
                let additionalInfo = (srcImage.includes('data:image/svg')) ? ' (sedang merangkai memori)' : '';
                lightboxImg.src = srcImage;
                lightboxCaption.innerHTML = `📷 ${captionIndah} ${additionalInfo}`;
                lightbox.classList.add('active');
            });
            
            galleryContainer.appendChild(polaroidCard);
        });
    }

    // Tutup lightbox
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target === lightboxModal) {
            lightbox.classList.remove('active');
        }
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
        }
    });

    // Tombol nostalgia efek lembut (tidak mempengaruhi musik, hanya animasi foto)
    const nostalgicBtn = document.getElementById('refreshMoodBtn');
    nostalgicBtn.addEventListener('click', () => {
        const allCards = document.querySelectorAll('.polaroid');
        allCards.forEach(card => {
            card.style.transition = 'all 0.12s';
            card.style.transform = `scale(0.98) rotate(${Math.random() * 2 - 1}deg)`;
            setTimeout(() => {
                card.style.transform = '';
            }, 180);
        });
        const toastMsg = document.createElement('div');
        toastMsg.innerText = '🎞️ bernostalgia dengan irama...';
        toastMsg.style.position = 'fixed';
        toastMsg.style.bottom = '22px';
        toastMsg.style.left = '50%';
        toastMsg.style.transform = 'translateX(-50%)';
        toastMsg.style.backgroundColor = '#2e241be6';
        toastMsg.style.color = '#f7e5cd';
        toastMsg.style.padding = '8px 20px';
        toastMsg.style.borderRadius = '40px';
        toastMsg.style.fontFamily = 'monospace';
        toastMsg.style.fontSize = '0.8rem';
        toastMsg.style.zIndex = '999';
        toastMsg.style.pointerEvents = 'none';
        document.body.appendChild(toastMsg);
        setTimeout(() => {
            toastMsg.style.opacity = '0';
            setTimeout(() => toastMsg.remove(), 500);
        }, 1400);
    });

    // Inisialisasi galeri saat halaman siap
    document.addEventListener('DOMContentLoaded', () => {
        renderNostalgiaGallery();
    });
</script>

<!-- 
    ✨ Petunjuk untuk pemilik halaman (tidak tampil di layar pengguna):
    
    1. FOTO (format HEIC):
       - Letakkan 4 file HEIC di dalam folder "img" dengan nama persis:
         lanurpratamaa-20260501-0002.heic
         lanurpratamaa-20260501-0003.heic
         lanurpratamaa-20260501-0004.heic
         lanurpratamaa-20260501-0005.heic
       
    2. MUSIK:
       - Letakkan file musik (mp3) di dalam folder "mp3" dengan nama "music.mp3"
       - Musik akan otomatis diputar saat halaman dimuat (dengan usaha melewati kebijakan autoplay browser)
       - Jika browser menghalangi autoplay, musik akan mulai saat pengguna pertama kali berinteraksi dengan halaman (klik / sentuh / keyboard),
         tanpa perlu tombol apapun. Pengguna tetap merasakan musik menyala secara alami.
     
    3. DESAIN:
       - Tidak ada satupun teks yang memperlihatkan folder "img", "mp3", atau struktur teknis lainnya.
       - Semua tombol kontrol musik (play, stop, volume, dll) telah dihilangkan sepenuhnya.
       - Suasana vintage dan nostalgia tetap menjadi fokus utama.
       
    4. KOMPATIBILITAS HEIC:
       - Browser Safari di perangkat Apple menampilkan HEIC dengan baik.
       - Chrome / Edge di Windows mungkin perlu ekstensi atau decoder HEIC tambahan.
       - Jika gambar gagal dimuat, akan muncul placeholder halus tanpa menyebut path teknis.
-->
</body>
</html>
